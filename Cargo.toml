[package]
name = "herdr-tui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lightweight multi-tab TUI client for herdr-core (hc) with bidirectional Space/Tab sync"
readme = "README.md"

[[bin]]
name = "hct"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["underline-color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-width = "0.2"
vt100 = "0.15"
